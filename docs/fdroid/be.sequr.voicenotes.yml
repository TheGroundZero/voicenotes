# Context, the team's answers and the open points: rfp-draft.md.
# DRAFT of an F-Droid build recipe (the file that would be proposed to https://gitlab.com/fdroid/fdroiddata as
# metadata/be.sequr.voicenotes.yml). F-Droid's own `lint`, `readmeta` and `checkupdates` pass on it (2026-10-28, see rfp-draft.md);
# `fdroid build` has not been run. For the real submission use the output of `fdroid rewritemeta` (canonical order, no comments).
# Keep the version fields in step with the release that is submitted. Field reference: https://f-droid.org/docs/Build_Metadata_Reference/
Categories:
  - Note
  - Recorder
  - Speech Recognizer
License: GPL-3.0-or-later
AuthorName: Sequr
WebSite: https://tangled.org/sequr.be/voicenotes
SourceCode: https://tangled.org/sequr.be/voicenotes
IssueTracker: https://tangled.org/sequr.be/voicenotes/issues/
Changelog: https://tangled.org/sequr.be/voicenotes/blob/main/CHANGELOG.md
Donate: https://ko-fi.com/s4squatch  # also in .github/FUNDING.yml (branch chore/funding), which F-Droid uses to check it

# Speech models are downloaded from huggingface.co only when the user asks, and every model can also be imported from storage
# (Models screen, "Import a model from a file..."). The team said NonFreeNet may apply unless users can load from storage, so
# none is declared here; confirm in the request.

AutoName: Voice Notes

RepoType: git
# F-Droid clones the read-only GitHub mirror (stable URL, the release tags are there and the releases are built from it); the project itself
# lives on Tangled (SourceCode above).
Repo: https://github.com/TheGroundZero/voicenotes.git

Builds:
  - versionName: 0.6.0  # TODO: the first release without the bundled model; set to the release that is submitted
    versionCode: 8
    commit: v0.6.0
    subdir: app
    submodules: true
    gradle:
      - yes
    # Open question 2: the build needs CMake 3.22.1 and NDK 27.2.12479018 (both pinned in scripts/setup-toolchain.sh);
    # whether the F-Droid build server provides them or the recipe must install them has to be checked.
    ndk: 27.2.12479018
    # whisper.cpp is the submodule; our patch must be applied before the native build (CMake fails without it).
    prebuild: ../scripts/setup-third-party.sh
    # Answered by F-Droid on 2026-10-27: things must be built, or downloaded by the user (NonFreeNet may apply, maybe not if
    # users can load them from storage). So the app no longer bundles the one small binary file it used to (the MIT licensed
    # Silero voice-activity model, 885 KB): like the Whisper models it is downloaded on request and checked against a pinned
    # SHA-256, or imported from a file (scripts/fetch-vad-model.sh proves the pin is the upstream file). The APK has no model.

# Reproducible build: the release APK is byte-identical between GitHub Actions and a clean local build
# (scripts/verify-reproducible.sh). Reference: the signed APK of the GitHub release; the key is the one in README.md.
Binaries: https://github.com/TheGroundZero/voicenotes/releases/download/v%v/voicenotes-%v.apk
AllowedAPKSigningKeys: 2e17596e99b88f970fff56423db2864490fb2088cfecbbe804255b88c4f15e1e

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.6.0
CurrentVersionCode: 8
