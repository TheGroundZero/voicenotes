# DRAFT, untested: for the optional GitHub mirror of the Tangled repository (the heavy build runs here, Tangled stays
# the source of truth). Before first use: pin every `uses:` to a commit SHA you have reviewed, and add the secrets
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (see docs/RELEASING.md).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to the release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces (versions as in scripts/setup-toolchain.sh)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Checks
        run: scripts/check.sh
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build the signed release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK and write its checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/voicenotes-${version}.apk"
          (cd dist && sha256sum "voicenotes-${version}.apk" > "voicenotes-${version}.apk.sha256")
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
