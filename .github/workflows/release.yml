# Optional GitHub mirror of the Tangled repository: it only builds and publishes release APKs. A tag `v*` runs the
# full checks, builds the release APK, signs it and attaches it to a GitHub release. Nothing else triggers it: day to
# day testing is done locally with scripts/check.sh (docs/BUILDING.md). "Run workflow" in the Actions tab does the same
# build without signing or publishing, as a dry run. Only GitHub's own actions are used, pinned to commit SHAs
# (checkout v7.0.1, setup-java v6.1.0); update them deliberately. The secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD are described in docs/RELEASING.md.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to the release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces (versions as in scripts/setup-toolchain.sh)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Apply our whisper.cpp patch (the native build refuses to configure without it)
        run: scripts/setup-third-party.sh
      - name: Checks
        run: scripts/check.sh
      - name: Signing key (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build the release APK (signed when the signing key was set up, otherwise unsigned)
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/voicenotes-${version}.apk"
          (cd dist && sha256sum "voicenotes-${version}.apk" > "voicenotes-${version}.apk.sha256")
          gh release create "$GITHUB_REF_NAME" dist/* --title "Voice Notes ${version}" --notes-file <(awk -v h="## [${version}]" 'index($0, h) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md)
